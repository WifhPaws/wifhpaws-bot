<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WifhPaws Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #051910;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card {
            background: rgba(14, 43, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(26, 110, 71, 0.4);
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        .avatar-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(5, 25, 16, 0.8);
            border: 2px solid #27d97b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 12px auto;
        }
        .header {
            font-weight: 600;
            font-size: 18px;
            color: #27d97b;
            margin-bottom: 4px;
        }
        .subtext {
            font-size: 12px;
            color: #8fa89d;
            margin-bottom: 16px;
        }
        .asset-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 25, 16, 0.5);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(26, 110, 71, 0.2);
            text-align: left;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-align: center;
        }
        .btn-deposit { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
        .btn-send { background: linear-gradient(135deg, #059669, #10b981); }
        .btn-swap { background: linear-gradient(135deg, #10b981, #059669); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Card -->
        <div class="card">
            <div class="avatar-circle">🐶</div>
            <div class="header" id="user-name">WifhPaws HQ</div>
            <div class="subtext" id="user-handle">@WifhPawsUser</div>
        </div>

        <!-- Treasured Assets -->
        <div class="card" style="text-align: left;">
            <div style="font-size: 12px; color: #10b981; font-weight: bold; margin-bottom: 12px;">MY TREASURED ASSETS</div>
            
            <div class="asset-row">
                <span>🐶 WIFH Token</span>
                <span id="wifh-balance" style="font-weight: bold; color: #10b981;">Loading...</span>
            </div>
            
            <div class="asset-row">
                <span>⚡ ETH (Gas)</span>
                <span id="eth-balance" style="font-weight: bold; color: #10b981;">Loading...</span>
            </div>

            <div class="btn-group">
                <button class="btn btn-deposit" onclick="handleAction('deposit')">Deposit</button>
                <button class="btn btn-send" onclick="handleAction('send')">Send</button>
            </div>
        </div>

        <!-- Instant Token Swap Card -->
        <div class="card" style="text-align: left;">
            <div style="font-size: 12px; color: #10b981; font-weight: bold; margin-bottom: 12px;">🔄 INSTANT TOKEN SWAP</div>
            
            <div style="margin-bottom: 12px;">
                <label style="font-size: 11px; color: #8fa89d; display: block; margin-bottom: 4px;">YOU PAY</label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="swap-amount" placeholder="0.0" oninput="updateEstimate()" style="flex: 1; background: rgba(5, 25, 16, 0.8); border: 1px solid rgba(26, 110, 71, 0.5); border-radius: 8px; color: white; padding: 10px; font-size: 14px; outline: none;">
                    <select id="swap-from" onchange="toggleSwapDirection()" style="background: rgba(5, 25, 16, 0.8); border: 1px solid rgba(26, 110, 71, 0.5); border-radius: 8px; color: #10b981; padding: 10px; font-weight: bold; outline: none;">
                        <option value="WIFH">WIFH</option>
                        <option value="ETH">ETH</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 16px;">
                <label style="font-size: 11px; color: #8fa89d; display: block; margin-bottom: 4px;">YOU RECEIVE (ESTIMATED)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="swap-receive" placeholder="0.0" readonly style="flex: 1; background: rgba(5, 25, 16, 0.5); border: 1px solid rgba(26, 110, 71, 0.2); border-radius: 8px; color: #27d97b; padding: 10px; font-size: 14px; font-weight: bold; outline: none;">
                    <span id="swap-to-label" style="background: rgba(5, 25, 16, 0.8); border: 1px solid rgba(26, 110, 71, 0.5); border-radius: 8px; color: #27d97b; padding: 10px; font-weight: bold; min-width: 60px; text-align: center; display: flex; align-items: center; justify-content: center;">ETH</span>
                </div>
            </div>

            <button id="btn-execute-swap" class="btn btn-swap" style="width: 100%;" onclick="handleSwap()">Swap Tokens Now</button>
        </div>
    </div>

    <script>
        let currentUserId = null;
        // Example Exchange Rate: 1 WIFH = 0.0001 ETH (1 ETH = 10,000 WIFH)
        const RATE_WIFH_PER_ETH = 10000;
        const API_BASE_URL = (window.location.hostname.includes('github.io') || window.location.protocol === 'file:')
            ? 'https://wifhpaws-bot.onrender.com'
            : '';

        function toggleSwapDirection() {
            const fromToken = document.getElementById('swap-from').value;
            document.getElementById('swap-to-label').innerText = fromToken === 'WIFH' ? 'ETH' : 'WIFH';
            updateEstimate();
        }

        function updateEstimate() {
            const amount = parseFloat(document.getElementById('swap-amount').value) || 0;
            const fromToken = document.getElementById('swap-from').value;
            let receive = 0;
            if (fromToken === 'WIFH') {
                receive = amount / RATE_WIFH_PER_ETH;
                document.getElementById('swap-receive').value = receive > 0 ? receive.toFixed(6) : '0.0';
            } else {
                receive = amount * RATE_WIFH_PER_ETH;
                document.getElementById('swap-receive').value = receive > 0 ? receive.toLocaleString() : '0.0';
            }
        }

        async function handleSwap() {
            const amount = parseFloat(document.getElementById('swap-amount').value);
            const fromToken = document.getElementById('swap-from').value;
            const toToken = fromToken === 'WIFH' ? 'ETH' : 'WIFH';

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount to swap.');
                return;
            }

            if (!currentUserId) {
                alert('User authentication details not available.');
                return;
            }

            const btn = document.getElementById('btn-execute-swap');
            btn.innerText = 'Processing Swap...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/api/swap`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUserId,
                        from: fromToken.toLowerCase(),
                        to: toToken.toLowerCase(),
                        amount: amount
                    })
                });

                const data = await response.json();
                if (data.success) {
                    alert(`✅ Swap Successful!\nSwapped ${amount} ${fromToken} for ${data.received} ${toToken}.`);
                    window.location.reload();
                } else {
                    alert(`❌ Swap Failed: ${data.error || 'Transaction could not be completed.'}`);
                }
            } catch (err) {
                alert(`❌ Error executing swap: ${err.message}`);
            } finally {
                btn.innerText = 'Swap Tokens Now';
                btn.disabled = false;
            }
        }

        function handleAction(type) {
            const botUsername = 'WifhPawsBot';
            if (type === 'deposit') {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                    window.Telegram.WebApp.openTelegramLink(`https://t.me/${botUsername}?start=wallet`);
                    window.Telegram.WebApp.close();
                } else {
                    window.location.href = `https://t.me/${botUsername}?start=wallet`;
                }
            } else if (type === 'send') {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                    window.Telegram.WebApp.openTelegramLink(`https://t.me/${botUsername}?start=send`);
                    window.Telegram.WebApp.close();
                } else {
                    window.location.href = `https://t.me/${botUsername}?start=send`;
                }
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();

                const user = tg.initDataUnsafe?.user;
                if (user) {
                    currentUserId = user.id;
                    if (user.first_name) {
                        document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
                    }
                    if (user.username) {
                        document.getElementById('user-handle').innerText = '@' + user.username;
                    }

                    // Fetch live balances from backend
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/balance?telegram_id=${user.id}`);
                        const data = await response.json();
                        if (data.success) {
                            document.getElementById('wifh-balance').innerText = `${data.wifh_balance} WIFH`;
                            document.getElementById('eth-balance').innerText = `${data.eth_balance} ETH`;
                        } else {
                            document.getElementById('wifh-balance').innerText = '0 WIFH';
                            document.getElementById('eth-balance').innerText = '0 ETH';
                        }
                    } catch (err) {
                        console.error('Failed to fetch live balances', err);
                        document.getElementById('wifh-balance').innerText = '0.0 WIFH';
                        document.getElementById('eth-balance').innerText = '0.0 ETH';
                    }
                }
            }
        });
    </script>
</body>
</html>
