<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WifhPaws Dashboard</title>
    <!-- Official Telegram WebApp SDK required for mobile rendering -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #051910;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card {
            background: rgba(14, 43, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(26, 110, 71, 0.4);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .header {
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            color: #27d97b;
            margin-bottom: 8px;
        }
        .subtext {
            text-align: center;
            font-size: 12px;
            color: #8fa89d;
            margin-bottom: 16px;
        }
        .asset-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 25, 16, 0.5);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(26, 110, 71, 0.2);
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-align: center;
        }
        .btn-deposit { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
        .btn-send { background: linear-gradient(135deg, #059669, #10b981); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Card -->
        <div class="card">
            <div class="header" id="user-name">WifhPaws HQ</div>
            <div class="subtext" id="user-handle">@WifhPawsUser</div>
        </div>

        <!-- Treasured Assets -->
        <div class="card">
            <div style="font-size: 12px; color: #10b981; font-weight: bold; margin-bottom: 12px;">MY TREASURED ASSETS</div>
            
            <div class="asset-row">
                <span>🐶 WIFH Token</span>
                <span style="font-weight: bold; color: #10b981;">1,500 WIFH</span>
            </div>
            
            <div class="asset-row">
                <span>⚡ ETH (Gas)</span>
                <span style="font-weight: bold; color: #10b981;">0.045 ETH</span>
            </div>

            <div class="btn-group">
                <button class="btn btn-deposit" onclick="alert('Deposit triggered')">Deposit</button>
                <button class="btn btn-send" onclick="alert('Send Gift triggered')">Send Gift</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp SDK bindings
        window.addEventListener('DOMContentLoaded', (event) => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();

                // Pull real Telegram profile data if available
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    if (user.first_name) {
                        document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
                    }
                    if (user.username) {
                        document.getElementById('user-handle').innerText = '@' + user.username;
                    }
                }
            }
        });
    </script>
</body>
</html>
