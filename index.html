<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WifhPaws Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #051910;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card {
            background: rgba(14, 43, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(26, 110, 71, 0.4);
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        .avatar-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(5, 25, 16, 0.8);
            border: 2px solid #27d97b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 12px auto;
        }
        .header {
            font-weight: 600;
            font-size: 18px;
            color: #27d97b;
            margin-bottom: 4px;
        }
        .subtext {
            font-size: 12px;
            color: #8fa89d;
            margin-bottom: 16px;
        }
        .asset-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 25, 16, 0.5);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(26, 110, 71, 0.2);
            text-align: left;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-align: center;
        }
        .btn-deposit { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
        .btn-send { background: linear-gradient(135deg, #059669, #10b981); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Card -->
        <div class="card">
            <div class="avatar-circle">🐶</div>
            <div class="header" id="user-name">WifhPaws HQ</div>
            <div class="subtext" id="user-handle">@WifhPawsUser</div>
        </div>

        <!-- Treasured Assets -->
        <div class="card" style="text-align: left;">
            <div style="font-size: 12px; color: #10b981; font-weight: bold; margin-bottom: 12px;">MY TREASURED ASSETS</div>
            
            <div class="asset-row">
                <span>🐶 WIFH Token</span>
                <span id="wifh-balance" style="font-weight: bold; color: #10b981;">Loading...</span>
            </div>
            
            <div class="asset-row">
                <span>⚡ ETH (Gas)</span>
                <span id="eth-balance" style="font-weight: bold; color: #10b981;">Loading...</span>
            </div>

            <div class="btn-group">
                <button class="btn btn-deposit" onclick="alert('Deposit modal opening...')">Deposit</button>
                <button class="btn btn-send" onclick="alert('Send Gift modal opening...')">Send Gift</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();

                const user = tg.initDataUnsafe?.user;
                if (user) {
                    if (user.first_name) {
                        document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
                    }
                    if (user.username) {
                        document.getElementById('user-handle').innerText = '@' + user.username;
                    }

                    // Fetch live balances from backend
                    try {
                        const response = await fetch(`/api/balance?telegram_id=${user.id}`);
                        const data = await response.json();
                        if (data.success) {
                            document.getElementById('wifh-balance').innerText = `${data.wifh_balance} WIFH`;
                            document.getElementById('eth-balance').innerText = `${data.eth_balance} ETH`;
                        } else {
                            document.getElementById('wifh-balance').innerText = '0 WIFH';
                            document.getElementById('eth-balance').innerText = '0 ETH';
                        }
                    } catch (err) {
                        console.error('Failed to fetch live balances', err);
                        document.getElementById('wifh-balance').innerText = '0.0 WIFH';
                        document.getElementById('eth-balance').innerText = '0.0 ETH';
                    }
                }
            }
        });
    </script>
</body>
</html>
